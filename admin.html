<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — JoppeDS Studio's</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14161c">
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin">

<!-- ======================= Inloggen ======================= -->
<section class="login" id="loginview">
  <div class="login__box">
    <h1>Admin</h1>
    <p class="sub">Log in om berichten te lezen en de site aan te passen.</p>

    <form class="form" id="loginform">
      <div class="field">
        <label for="l-email">E-mailadres</label>
        <input id="l-email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="l-pass">Wachtwoord</label>
        <input id="l-pass" type="password" autocomplete="current-password" required>
      </div>
      <div class="form__note" id="loginnote" hidden></div>
      <button class="btn btn--fill" type="submit" id="loginbtn">Inloggen</button>
    </form>
  </div>
</section>

<!-- ======================= Paneel ======================= -->
<div id="panel" hidden>

  <header class="admin-bar">
    <div class="admin-bar__in">
      <div class="tabs">
        <button class="tab is-on" data-tab="berichten">Berichten <span id="badge"></span></button>
        <button class="tab" data-tab="aanvragen">Aanvragen <span id="badge-aanvragen"></span></button>
        <button class="tab" data-tab="bezoekers">Bezoekers</button>
        <button class="tab" data-tab="inhoud">Inhoud</button>
      </div>
      <div style="display:flex;align-items:center;gap:14px">
        <span class="admin-bar__who" id="who"></span>
        <a class="mini" href="index.html" target="_blank" rel="noopener">Site openen</a>
        <button class="mini" id="logout">Uitloggen</button>
      </div>
    </div>
  </header>

  <div class="admin-wrap">

    <!-- ---------- Berichten ---------- -->
    <section class="tabpane" id="pane-berichten">
      <div id="msglist"></div>
    </section>

    <!-- ---------- Aanvragen ---------- -->
    <section class="tabpane" id="pane-aanvragen" hidden>

      <details class="group" id="codegroep">
        <summary>
          <span>Toegangscodes</span>
          <span class="group__sub" id="codesamenvatting"></span>
        </summary>
        <div class="group__body">
          <p class="hint">
            Genereer een code en stuur die naar de klant. Met die code kan hij op
            <code>aanvraag.html</code> één keer een projectaanvraag indienen.
          </p>

          <div class="form__row">
            <div class="field">
              <label for="c-label">Waarvoor is deze code?</label>
              <input id="c-label" type="text" maxlength="80" placeholder="Bijvoorbeeld: Warande Kortrijk">
            </div>
            <div class="field">
              <label for="c-email">E-mailadres van de klant</label>
              <input id="c-email" type="email" maxlength="160" placeholder="Optioneel, om te onthouden">
            </div>
          </div>
          <div class="form__row">
            <div class="field">
              <label for="c-dagen">Geldig gedurende</label>
              <select id="c-dagen">
                <option value="14">14 dagen</option>
                <option value="30" selected>30 dagen</option>
                <option value="90">90 dagen</option>
                <option value="">Onbeperkt</option>
              </select>
            </div>
            <div class="field" style="align-self:end">
              <button class="btn btn--fill" id="genereer">Code genereren</button>
            </div>
          </div>

          <div class="form__note" id="codenote" hidden></div>

          <div class="diagnose">
            <button class="mini" id="diagnoseknop">Controleer de installatie</button>
            <span class="hint" style="margin:0">Werkt een code niet? Klik hier eerst.</span>
          </div>
          <div id="diagnose"></div>

          <div id="codelijst" style="margin-top:18px"></div>
        </div>
      </details>

      <div class="filters" id="statusfilter">
        <button class="mini is-on" data-status="">Alles</button>
        <button class="mini" data-status="nieuw">Nieuw</button>
        <button class="mini" data-status="in behandeling">In behandeling</button>
        <button class="mini" data-status="goedgekeurd">Goedgekeurd</button>
        <button class="mini" data-status="afgerond">Afgerond</button>
        <button class="mini" data-status="afgewezen">Afgewezen</button>
      </div>

      <div id="aanvraaglijst"></div>
    </section>

    <!-- ---------- Bezoekers ---------- -->
    <section class="tabpane" id="pane-bezoekers" hidden>
      <div class="range" id="range">
        <button class="mini is-on" data-days="7">Laatste 7 dagen</button>
        <button class="mini" data-days="30">Laatste 30 dagen</button>
        <button class="mini" data-days="90">Laatste 90 dagen</button>
      </div>
      <div id="statsview"></div>
    </section>

    <!-- ---------- Inhoud ---------- -->
    <section class="tabpane" id="pane-inhoud" hidden>
      <div id="editor"></div>

      <div class="savebar">
        <button class="btn btn--fill" id="save">Wijzigingen opslaan</button>
        <button class="mini" id="reload">Opnieuw laden</button>
        <span class="status" id="savestatus"></span>
      </div>
    </section>

  </div>
</div>

<dialog class="sheet" id="detail"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/content.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
